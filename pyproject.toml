[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retryq"
version = "0.1.0"
description = "Retry flaky commands with exponential backoff and full jitter. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agenticspring" }]
keywords = ["retry", "backoff", "jitter", "cli", "ci"]

[project.scripts]
retryq = "retryq:main"

[tool.setuptools]
py-modules = ["retryq"]
